name: CI

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  check-source:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only develop can merge into main
        if: github.head_ref != 'develop'
        run: |
          echo "PRs to main must come from develop"
          exit 1

  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            account: 'account/**'
            authentication: 'authentication/**'
            frauddetection: 'frauddetection/**'
            reporting: 'reporting/**'
            transaction: 'transaction/**'

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Build and test
        run: mvn -B clean verify

  # Single job to mark as "required" in branch protection
  ci-result:
    if: always()
    needs: [ check-source, build ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
